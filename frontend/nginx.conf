# Serves the dashboard and proxies API calls to the backend: one origin for the browser, no CORS needed.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location /api/      { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /actuator/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
  location /          { try_files $uri /index.html; }
}
