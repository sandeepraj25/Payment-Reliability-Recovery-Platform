name: CI

on:
  push:
  pull_request:

jobs:
  # Unit tests (*Test) + integration tests (*IT). GitHub's ubuntu runners have Docker,
  # so IntegrationTestBase starts PostgreSQL 16 with Testcontainers automatically.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run all tests
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  # Pure-SQL invariant checks + database-level concurrency test, straight against PostgreSQL.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payguard
          POSTGRES_USER: payguard
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payguard" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: payguard
      PGPASSWORD: ci-only-password
      PGDATABASE: payguard
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client tools (psql, pgbench)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        run: for f in backend/src/main/resources/db/migration/V*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Schema invariant checks
        run: psql -v ON_ERROR_STOP=1 -f backend/src/test/sql/schema_checks.sql
      - name: 1000 concurrent duplicate webhook inserts
        run: |
          pgbench -n -c 100 -j 4 -t 10 -f backend/src/test/sql/concurrent_webhook_dedup.pgbench
          rows=$(psql -tAc "SELECT count(*) FROM webhook_events WHERE provider_event_id='evt_concurrency_1'")
          dups=$(psql -tAc "SELECT duplicate_count FROM webhook_events WHERE provider_event_id='evt_concurrency_1'")
          echo "rows=$rows duplicate_count=$dups"
          test "$rows" = "1" && test "$dups" = "999"
