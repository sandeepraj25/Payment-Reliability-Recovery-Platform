# Test-only values. These are NOT secrets: they only exist inside test runs.
payguard:
  security:
    admin-username: admin
    admin-password: test-admin-password
    gateway-client-id: merchant_client
    gateway-client-secret: test-gateway-secret
  simulator:
    enabled: true
    webhook-secret: test-webhook-secret-0123456789
    timeout-sleep-ms: 3000
    webhook-delay-ms: 1500
  webhooks:
    providers:
      payguard-sim:
        secrets:
          - test-webhook-secret-0123456789
        tolerance: PT5M
  outbox:
    poll-interval-ms: 100
    confirm-timeout: PT3S
  worker:
    concurrency: "4"
    max-attempts: 3
    base-delay: PT0.2S
    max-delay: PT1S
  faults:
    enabled: true
  reconciliation:
    scheduled: false            # tests trigger runs explicitly
    settlement-expected-within: PT5S
  gateway:
    read-timeout: PT2S
  idempotency:
    lease: PT30S
    ttl: P1D

server:
  tomcat:
    threads:
      max: 200
    accept-count: 1000          # 1,000-connection bursts in concurrency tests
    max-connections: 10000

spring:
  datasource:
    hikari:
      connection-timeout: 3000     # outage tests must fail fast, not wait 30 s
      data-source-properties:
        socketTimeout: 10
